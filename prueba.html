<!doctype html>
<html
  lang="es"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>4to Seminario Técnico Syensqo</title>
    <!--[if mso]>
      <noscript>
        <xml>
          <o:OfficeDocumentSettings>
            <o:PixelsPerInch>96</o:PixelsPerInch>
          </o:OfficeDocumentSettings>
        </xml>
      </noscript>
    <![endif]-->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
      type="text/css"
    />
    <style>
      body,
      table,
      td {
        font-family: "Poppins", Arial, Helvetica, sans-serif;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #ffd7bc;
        -webkit-text-size-adjust: 100%;
      }
      img {
        border: 0;
        display: block;
      }
      a {
        text-decoration: none;
      }
      .card-gradient {
        background-color: #ffffff; /* fallback blanco */
        background-image: linear-gradient(180deg, #ffffff 0%, #fdeee4 100%);
      }
      @media only screen and (max-width: 480px) {
        .container {
          width: 100% !important;
        }
        .px {
          padding-left: 20px !important;
          padding-right: 20px !important;
        }
      }

      /* --- Protección contra dark mode (Apple Mail, Outlook mobile) --- */
      @media (prefers-color-scheme: dark) {
        body,
        .force-bg-outer {
          background-color: #ffd7bc !important;
        }
        .card-gradient,
        .force-bg-card {
          background-color: #ffffff !important;
          background-image: linear-gradient(
            180deg,
            #ffffff 0%,
            #fdeee4 100%
          ) !important;
        }
        .force-text {
          color: #333333 !important;
        }
        .force-bg-dark {
          background-color: #1a1a1a !important;
        }
        .force-text-white {
          color: #ffffff !important;
        }
        .force-btn {
          background-color: #ff5431 !important;
        }
      }

      /* --- Protección contra dark mode de Gmail (web y algunas apps) --- */
      [data-ogsc] body,
      [data-ogsc] .force-bg-outer {
        background-color: #ffd7bc !important;
      }
      [data-ogsc] .card-gradient,
      [data-ogsc] .force-bg-card {
        background-color: #ffffff !important;
      }
      [data-ogsc] .force-text {
        color: #333333 !important;
      }
      [data-ogsc] .force-bg-dark {
        background-color: #1a1a1a !important;
      }
      [data-ogsc] .force-text-white {
        color: #ffffff !important;
      }
      [data-ogsc] .force-btn {
        background-color: #ff5431 !important;
      }
    </style>
  </head>
  <body
    style="margin: 0; padding: 0; background-color: #ffd7bc"
    class="force-bg-outer"
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #ffd7bc"
      class="force-bg-outer"
    >
      <tr>
        <td align="center" style="padding: 24px 12px">
          <!--[if gte mso 9]>
<v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:480px;">
<v:fill type="gradient" color="#ffffff" color2="#fdeee4" angle="90" />
<v:textbox inset="0,0,0,0">
<![endif]-->
          <table
            role="presentation"
            class="container card-gradient force-bg-card"
            width="480"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              width: 480px;
              max-width: 480px;
              border-radius: 12px;
              overflow: hidden;
            "
          >
            <!-- Header con logo Syensqo e imagen decorativa -->
            <tr>
              <td style="padding: 16px 16px 0 24px">
                <table
                  role="presentation"
                  width="440"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="width: 440px"
                >
                  <tr>
                    <td
                      width="167"
                      align="left"
                      valign="top"
                      style="width: 167px"
                    >
                      <img
                        src="https://seminariotecnicosyensqoperu.com/_astro/logo.BYFa-rrc_14ofYH.png"
                        width="167"
                        alt="Syensqo - Advancing Humanity"
                        style="display: block"
                      />
                    </td>
                    <td
                      width="173"
                      style="width: 173px; line-height: 1px; font-size: 1px"
                    >
                      &nbsp;
                    </td>
                    <td
                      width="100"
                      align="right"
                      valign="top"
                      style="width: 100px"
                    >
                      <img
                        src="https://verborrea.github.io/syensqo/deco.png"
                        width="100"
                        alt=""
                        style="display: block"
                      />
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Banner degradado con numero 4 y titulo -->
            <tr>
              <td style="padding: 0">
                <img
                  src="https://verborrea.github.io/syensqo/4to.png"
                  width="360"
                  alt="4to Seminario Técnico Syensqo"
                  style="display: block; width: 75%; margin: auto"
                />
              </td>
            </tr>

            <!-- Cuerpo del texto -->
            <tr>
              <td
                class="px force-text"
                style="
                  padding: 28px 32px 8px 32px;
                  font-family:
                    &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
                  color: #333333;
                "
              >
                <p
                  style="margin: 0 0 16px 0; font-size: 16px; line-height: 23px"
                >
                  Estimado Sr.
                </p>
                <p
                  style="margin: 0 0 20px 0; font-size: 16px; line-height: 23px"
                >
                  Le invitamos a participar de nuestro
                  <strong>4to Seminario Técnico Syensqo</strong>, un espacio
                  para explorar los avances que impulsan la humanidad.
                </p>
              </td>
            </tr>

            <!-- Boton -->
            <tr>
              <td align="center" style="padding: 8px 32px 32px 32px">
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td
                      align="center"
                      style="border-radius: 10px; background-color: #ff5431"
                      class="force-btn"
                    >
                      <a
                        href="https://seminariotecnicosyensqoperu.com/"
                        target="_blank"
                        style="
                          display: inline-block;
                          padding: 16px 36px;
                          font-family:
                            &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
                          font-size: 16px;
                          font-weight: 700;
                          color: #ffffff !important;
                          text-decoration: none !important;
                        "
                        class="force-text-white"
                        >Regístrate Aquí!</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Imagen de Arequipa con leyenda -->
            <tr>
              <td style="position: relative; padding: 0">
                <img
                  src="https://verborrea.github.io/syensqo/arequipa.png"
                  width="480"
                  alt="Arequipa"
                  style="display: block; width: 100%"
                />
              </td>
            </tr>
            <tr>
              <td
                style="background-color: #1a1a1a; padding: 14px 24px"
                class="force-bg-dark"
              >
                <p
                  style="
                    margin: 0;
                    font-family:
                      &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
                    font-size: 14px;
                    color: #ffffff;
                    text-align: center;
                  "
                  class="force-text-white"
                >
                  Explorando avances que impulsan la humanidad
                </p>
              </td>
            </tr>
          </table>
          <!--[if gte mso 9]>
</v:textbox>
</v:rect>
<![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
